    <script>
      (function () {
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        if (isLocal) {
          document.documentElement.classList.remove('dark')
          return
        }
        const theme = localStorage.getItem('theme')
        if (theme !== 'dark') {
          document.documentElement.classList.remove('dark')
        }
